<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <span class="logo-dot">●</span>
                </div>
                <h1>Chat Online</h1>
                <p>Conecte-se e converse em tempo real</p>
            </div>
            
            <div class="login-section">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">Nome de Usuário</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Digite seu nome de usuário"
                            required
                            minlength="3"
                            autocomplete="username"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Digite sua senha"
                            required
                            minlength="4"
                            autocomplete="current-password"
                        >
                    </div>
                    
                    <button type="submit" id="loginBtn" class="submit-btn">
                        <span>Entrar</span>
                    </button>
                </form>
                
                <div class="divider">
                    <span>ou</span>
                </div>
                
                <button id="registerBtn" class="register-btn">
                    Criar uma conta
                </button>
                
                <div class="features">
                    <div class="feature-item">
                        <span class="feature-icon">✨</span>
                        <span>Chat em tempo real</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">⚡</span>
                        <span>Rápido e seguro</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🔒</span>
                        <span>Senhas protegidas</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="background-animation">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
